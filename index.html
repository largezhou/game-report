<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏通关报告 · 头上有灰机</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;600;700;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg:#0a0c10;
  --bg2:#15151b;
  --surface:#12141a;
  --border:rgba(126,211,164,.18);
  --ink:#e4e2d8;
  --ink2:#8a8892;
  --ink3:#555a64;
  --green:#7ed3a4;
  --green-fill:rgba(126,211,164,.15);
  --cyan:#64dfdf;
  --amber:#e9c58a;
  --amber-fill:rgba(233,197,138,.12);
  --rose:#d4a0b9;
  --red:#ff6b6b;
  --red-fill:rgba(255,107,107,.10);
  --font-mono:'JetBrains Mono','SF Mono','Inter','Noto Sans SC',monospace;
  --font-sans:'Inter','Noto Sans SC',sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  background:var(--bg);color:var(--ink);font-family:var(--font-mono);
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;
}

/* 56px 赛博网格 + radial mask 渐隐 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(126,211,164,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(126,211,164,.08) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 80%);
}

/* CRT 暗角 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.6) 100%);
}

/* 扫描线 (绿色 + screen blend) */
.scanlines{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,rgba(126,211,164,.025) 3px,rgba(126,211,164,.025) 4px);
  mix-blend-mode:screen;
}

.wrap{max-width:860px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

/* Chrome dots */
.chrome{display:flex;align-items:center;gap:8px;padding:12px 0;margin-bottom:8px}
.chrome .dots{display:flex;gap:8px}
.chrome .dots span{width:11px;height:11px;border-radius:50%}
.chrome .dots span:nth-child(1){background:#ff5f57}
.chrome .dots span:nth-child(2){background:#febc2e}
.chrome .dots span:nth-child(3){background:var(--green)}
.chrome div:last-child{font-size:11px;color:var(--ink2);margin-left:auto;letter-spacing:.18em;text-transform:uppercase}

/* Prompt */
.prompt{font-size:12px;color:var(--green);font-weight:500;margin-bottom:4px}
.prompt::before{content:'$ ';color:var(--cyan)}
.prompt .cmd{color:var(--ink)}

/* Hero */
.hero-title{
  font-family:'JetBrains Mono',monospace;font-size:72px;font-weight:700;line-height:1.05;letter-spacing:-.02em;
  color:var(--green);text-shadow:0 0 30px rgba(126,211,164,.35),0 0 60px rgba(126,211,164,.1);
}
.cursor{display:inline-block;width:12px;height:1em;background:var(--green);vertical-align:middle;margin-left:6px;animation:hcBlink 1s steps(2) infinite}
@keyframes hcBlink{50%{opacity:0}}

.lede{font-size:18px;line-height:1.7;color:var(--ink2);max-width:780px;font-family:var(--font-sans);font-weight:300}
.h2{font-size:46px;font-weight:600;color:var(--ink);margin-bottom:10px;letter-spacing:-.015em}
.h3{font-size:22px;font-weight:600;color:var(--amber);margin-bottom:10px}

/* Tag */
.tag{
  display:inline-block;font-family:var(--font-mono);font-size:11px;
  padding:3px 10px;border:1px solid var(--border);border-radius:4px;
  color:var(--green);background:rgba(126,211,164,.04);
  margin:2px 6px 2px 0;text-transform:uppercase;letter-spacing:.1em}
.tag.amber{color:var(--amber);border-color:rgba(233,197,138,.2);background:rgba(233,197,138,.04)}
.tag.red{color:var(--red);border-color:rgba(255,107,107,.25);background:rgba(255,107,107,.05)}

/* Section */
.section{padding:48px 0;position:relative;z-index:1}
.section+hr{border:none;border-top:1px solid rgba(126,211,164,.1)}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.kpi-grid .card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;position:relative;overflow:hidden}
.kpi-grid .card::before{content:'';position:absolute;top:-1px;left:12px;right:12px;
  height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.kpi-grid .label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.kpi-grid .value{font-size:22px;font-weight:700;color:var(--green);font-family:var(--font-mono)}
.kpi-grid .value.amber{color:var(--amber)}
.kpi-grid .sub{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.55;font-family:var(--font-sans)}

/* Now Playing */
.now-playing{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;margin-top:24px;position:relative;overflow:hidden}
.now-playing::before{content:'';position:absolute;top:-1px;left:12px;right:12px;
  height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.now-playing::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 50%,rgba(126,211,164,.06) 0%,transparent 60%)}
.now-playing .np-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.now-playing .np-label::before{content:'▶ ';color:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.now-playing .np-title{font-size:28px;font-weight:700;color:var(--green);
  text-shadow:0 0 30px rgba(126,211,164,.35);margin-bottom:6px}
.now-playing .np-meta{font-size:13px;color:var(--ink2);line-height:1.6;font-family:var(--font-sans)}
.now-playing .np-meta span{color:var(--amber)}

/* Genre Bar (stroke-only) */
.genre-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.genre-row .g-name{width:80px;text-align:right;font-size:12px;color:var(--ink2);flex-shrink:0}
.genre-row .g-track{flex:1;height:20px;border:1px solid var(--border);border-radius:2px;position:relative;background:transparent}
.genre-row .g-fill{height:100%;border-right:2px solid var(--green);background:transparent;border-radius:2px;transition:width .6s ease}
.genre-row .g-count{font-size:11px;color:var(--ink3);width:28px;flex-shrink:0}

/* Insight */
.insight{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(126,211,164,.1)}
.insight:last-child{border-bottom:none}
.insight .icon{font-size:18px;flex-shrink:0;width:28px;text-align:center}
.insight .title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.insight .text{font-family:var(--font-sans);font-size:13px;color:var(--ink2);line-height:1.55}

/* Series */
.series-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.series-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;position:relative;overflow:hidden}
.series-card::before{content:'';position:absolute;top:-1px;left:12px;right:12px;
  height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.series-card.full{border-color:rgba(126,211,164,.3)}
.series-card .s-title{font-size:13px;font-weight:600;color:var(--ink)}
.series-card .s-tag{font-size:10px;margin-left:8px;color:var(--amber)}
.series-card .s-track{height:6px;border:1px solid var(--border);border-radius:2px;margin:8px 0 6px}
.series-card .s-fill{height:100%;background:var(--green);border-radius:2px}
.series-card .s-games{font-size:11px;color:var(--ink3)}

/* Games Grid */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:4px}
.game-chip{font-size:12px;padding:8px 12px;border:1px solid var(--border);border-radius:2px;
  color:var(--ink);background:transparent;transition:border-color .15s}
.game-chip:hover{border-color:var(--green)}

/* Platinum */
.game-chip.platinum{
  border:1px solid rgba(180,200,220,.45);
  background:linear-gradient(135deg,rgba(180,200,220,.08) 0%,rgba(255,255,255,.06) 50%,rgba(180,200,220,.08) 100%);
  color:#e8eef4;
  position:relative;overflow:hidden}
.game-chip.platinum::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  animation:platinumSweep 3s ease-in-out infinite}
@keyframes platinumSweep{0%{left:-100%}40%,100%{left:140%}}
.game-chip.platinum::after{
  content:'✧';position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:10px;color:rgba(200,215,235,.7);
  text-shadow:0 0 6px rgba(180,200,220,.5)}
.game-chip.platinum:hover{border-color:rgba(200,215,235,.7)}
.game-chip.platinum .pt-tip{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(20,22,28,.92);border-radius:2px;
  font-size:10px;letter-spacing:.18em;
  color:rgba(200,215,235,.9);opacity:0;transition:opacity .15s;pointer-events:none}
.game-chip.platinum:hover .pt-tip{opacity:1}

/* Platinum legend */
.pt-legend{display:inline-flex;align-items:center;gap:6px;margin-left:12px;
  font-size:11px;color:var(--ink3);vertical-align:middle}
.pt-legend-icon{display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;border:1px solid rgba(180,200,220,.35);border-radius:2px;
  background:linear-gradient(135deg,rgba(180,200,220,.08),rgba(255,255,255,.04));
  color:rgba(200,215,235,.8);font-size:10px}

/* Backlog */
.backlog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:12px}
.backlog-chip{font-size:12px;padding:10px 14px;border:1px solid var(--amber-fill);
  border-left:2px solid var(--amber);border-radius:2px;color:var(--ink2);background:transparent}
.backlog-chip .b-genre{font-size:10px;color:var(--ink3);margin-top:2px}

/* Footer */
.foot{
  padding:48px 0 32px;font-size:10px;color:var(--ink2);letter-spacing:.2em;text-transform:uppercase;
  border-top:1px solid rgba(126,211,164,.1);position:relative;z-index:1}

/* Responsive */
@media(max-width:640px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .series-grid{grid-template-columns:1fr}
  .hero-title{font-size:40px}
  .genre-row .g-name{width:56px;font-size:11px}
}
</style>
</head>

// 类型配置（顺序即显示顺序）
const GENRES = [
  {key:'动作冒险',label:'动作冒险'},
  {key:'ARPG',label:'动作 RPG / ARPG'},
  {key:'FPS/射击',label:'FPS / 射击'},
  {key:'平台跳跃',label:'平台跳跃'},

];

// 更新日期
const UPDATED_AT = '2026-07-04';


// ════════════════════════════════════════════════════════
//  计算层 — 所有数字从这里派生，不再有任何硬编码
// ════════════════════════════════════════════════════════

const doneSet = new Set(COMPLETED.map(g => g.name));
const backlogSet = new Set(BACKLOG.map(g => g.name));
const platinumSet = new Set(COMPLETED.filter(g => g.platinum).map(g => g.name));

const S = {
  total: COMPLETED.length + BACKLOG.length,
  done: COMPLETED.length,
  backlog: BACKLOG.length,
  ps: COMPLETED.filter(g => g.ps).length,
  platinum: platinumSet.size,
};
S.donePct = Math.round(S.done / S.total * 100);
S.psPct = Math.round(S.ps / S.done * 100);

// 按类型统计
const genreStats = GENRES.map(cfg => {
  const count = COMPLETED.filter(g => g.genre === cfg.key).length;
  return {...cfg, count};
});
const genreMax = Math.max(...genreStats.map(g => g.count), 1);

// 按系列统计
const seriesStats = SERIES.map(s => {
  const done = s.games.filter(n => doneSet.has(n)).length;
  const pending = s.games.filter(n => backlogSet.has(n));
  return {...s, done, total: s.games.length, pending, isFull: done === s.games.length};
});

// 多部系列（用于洞察）
const multiSeries = seriesStats.filter(s => s.done > 1);


// ════════════════════════════════════════════════════════
//  渲染层
// ════════════════════════════════════════════════════════

function $(id) { return document.getElementById(id); }

// ── Hero ──
$('s-hero').innerHTML = `
  <div class="chrome"><div class="dots"><span></span><span></span><span></span></div><div>~/gaming · zsh · 118x42</div></div>
  <div class="prompt">whoami <span class="cmd">--gaming</span></div>
  <h1 class="hero-title">GAMING<br>REPORT<span class="cursor"></span></h1>
  <p class="lede" style="margin-top:14px">${S.done} 款已通关 · ${S.backlog} 款待挑战${NOW_PLAYING ? ' · 1 款进行中' : ''} · ${GENRES.length} 个类型全覆盖。<br>从战神到黑神话，从蜘蛛侠到茶杯头——一份完整的游戏品味档案。</p>
  <div style="margin-top:26px">
    <span class="tag">ps5-native</span>
    <span class="tag">${S.done}-done</span>
    <span class="tag amber">action-adventure</span>
    <span class="tag red">eastern-shift</span>
  </div>`;

// ── KPI + Now Playing ──
let kpi = `
  <div class="prompt">jq <span class="cmd">'.stats'</span> gaming_profile.json</div>
  <h2 class="h2">核心数据</h2>
  <p class="lede">一眼看完所有关键指标</p>
  <div class="kpi-grid">
    <div class="card"><div class="label">已通关</div><div class="value">${S.done}</div><div class="sub">款游戏完成</div></div>
    <div class="card"><div class="label">待挑战</div><div class="value amber">${S.backlog}</div><div class="sub">款排队中</div></div>
    <div class="card"><div class="label">完成率</div><div class="value">${S.donePct}%</div><div class="sub">${S.done} / ${S.total} 总收录</div></div>
    <div class="card"><div class="label">PS 独占</div><div class="value">${S.ps}</div><div class="sub">占通关 ${S.psPct}%</div></div>
  </div>`;

if (NOW_PLAYING) {
  kpi += `
  <div class="now-playing">
    <div class="np-label">now playing</div>
    <div class="np-title">${NOW_PLAYING.name}</div>
    <div class="np-meta">${NOW_PLAYING.genre} · <span>${NOW_PLAYING.dev}</span> · ${NOW_PLAYING.platform} · 进行中</div>
    <div style="margin-top:10px"><span class="tag">playing</span></div>
  </div>`;
}
$('s-kpi').innerHTML = kpi;

// ── Genre ──
$('s-genre').innerHTML = `
  <div class="prompt">jq <span class="cmd">'[.completed | group_by(.genre) | map({genre: .[0].genre, count: length})] | sort_by(-.count)'</span> gaming_profile.json</div>
  <h2 class="h2">类型分布</h2>
  <p class="lede">动作冒险一骑绝尘，射击类紧随其后</p>
  <div style="margin-top:24px">
    ${genreStats.map(g => `
    <div class="genre-row">
      <div class="g-name">${g.label}</div>
      <div class="g-track"><div class="g-fill" style="width:${Math.round(g.count / genreMax * 100)}%"></div></div>
      <div class="g-count">${g.count}</div>
    </div>`).join('')}
  </div>`;

// ── Insights ──
const fpsAction = COMPLETED.filter(g => g.genre === 'FPS/射击' || g.genre === '动作冒险').length;
const insights = [
  {icon:'🎮', title:'PS5 原生派', text:`${S.ps} 款 PS 独占 / 先发游戏，占通关总数的 ${S.psPct}%。从战神到对马岛，从蜘蛛侠到最后生还者——你是索尼生态的忠实玩家。`},
  {icon:'🔫', title:'枪与刀的二元论', text:`FPS + 动作冒险合计 ${fpsAction} 款，占总数一半以上。你的手柄左扳机永远在按——不是在射击就是在格挡。`},
  {icon:'🀄', title:'东方审美迁移', text:'黑神话悟空、卧龙、师父、只狼……待玩队列还有浪人崛起、真三国无双、羊蹄山之魂。东方武侠/战国题材正成为新主线。'},
  {icon:'🔗', title:'系列忠诚度极高', text:`${multiSeries.map(s => `${s.name} ×${s.done}`).join('、')}——认准一个系列就打通关的习惯，通关率极高。`},
];

$('s-insights').innerHTML = `
  <div class="prompt">jq <span class="cmd">'.insights[]'</span> gaming_profile.json</div>
  <h2 class="h2">数据洞察</h2>
  ${insights.map(i => `
  <div class="insight">
    <span class="icon">${i.icon}</span>
    <div><div class="title">${i.title}</div><div class="text">${i.text}</div></div>
  </div>`).join('')}`;

// ── Series ──
$('s-series').innerHTML = `
  <div class="prompt">jq <span class="cmd">'[.completed | group_by(.series) | map(select(.[0].series != null)) | map({series: .[0].series, count: length, games: map(.name)})]'</span> gaming_profile.json</div>
  <h2 class="h2">系列制霸</h2>
  <p class="lede">同一个 IP 不止打通一部</p>
  <div class="series-grid">
    ${seriesStats.map(s => {
      const pct = Math.round(s.done / s.total * 100);
      const cls = s.isFull ? 'series-card full' : 'series-card';
      const tagColor = s.isFull ? 'var(--green)' : 'var(--amber)';
      const tagText = s.isFull ? `${s.done}/${s.total} ✓` : `${s.done}/${s.total} · 待玩`;
      const borderStyle = s.isFull ? 'border-color:rgba(126,211,164,.3)' : 'border-color:rgba(126,211,164,.2)';
      const gamesHtml = s.games.map(n => {
        if (doneSet.has(n)) return `${n} ✓`;
        if (backlogSet.has(n)) return `${n} <span style="color:var(--amber)">⏳ 待玩</span>`;
        return `${n}`;
      }).join(' · ');
      return `
    <div class="${cls}">
      <span class="s-title">${s.name}</span><span class="s-tag" style="color:${tagColor}">${tagText}</span>
      <div class="s-track" style="${borderStyle}"><div class="s-fill" style="width:${pct}%;background:var(--green)"></div></div>
      <div class="s-games">${gamesHtml}</div>
    </div>`;
    }).join('')}
  </div>`;

// ── Completed ──
const ptLegend = S.platinum > 0
  ? ` <span class="pt-legend"><span class="pt-legend-icon">✧ 白金奖杯</span> 全奖杯达成</span>`
  : '';
let doneHtml = `
  <div class="prompt">jq <span class="cmd">'.completed[] | .name'</span> gaming_profile.json</div>
  <h2 class="h2">已通关 · ${S.done} 款${ptLegend}</h2>
  <p class="lede">每一款都是真金白银+时间的投入</p>`;

GENRES.forEach(cfg => {
  const games = COMPLETED.filter(g => g.genre === cfg.key);
  if (games.length === 0) return;
  doneHtml += `
  <h3 class="h3" style="margin-top:28px">${cfg.label} · ${games.length}</h3>
  <div class="games-grid">${games.map(g => {
    if (platinumSet.has(g.name)) {
      return `<div class="game-chip platinum" title="白金奖杯">${g.name}<span class="pt-tip">✧ 白金奖杯</span></div>`;
    }
    return `<div class="game-chip">${g.name}</div>`;
  }).join('')}</div>`;
});
$('s-completed').innerHTML = doneHtml;

// ── Backlog ──
let backlogHtml = `
  <div class="prompt">jq <span class="cmd">'.backlog[] | .name'</span> gaming_profile.json</div>
  <h2 class="h2">待挑战 · ${S.backlog} 款</h2>
  <p class="lede">排队等临幸，迟早会通关</p>
  <div class="backlog-grid">${BACKLOG.map(b =>
    `<div class="backlog-chip"><div>${b.name}</div><div class="b-genre">${b.genre}</div></div>`
  ).join('')}</div>`;

if (NEXT_PICK) {
  backlogHtml += `
  <div class="cta-card">
    <div class="label">// 最值得期待</div>
    <div class="name">${NEXT_PICK.name}</div>
    <div class="desc">${NEXT_PICK.desc}</div>
  </div>`;
}
$('s-backlog').innerHTML = backlogHtml;

// ── Footer ──
$('s-footer').innerHTML = `
  <span>gaming_report · 头上有灰机 · ${new Date().getFullYear()}</span>
  <span style="float:right">last_update: ${UPDATED_AT}</span>`;

</script>
</body>
</html>
